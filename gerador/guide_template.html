<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atreia Hub - Aion 2</title>
<style>
:root{--bg:#f3f4fb;--panel:#fff;--side:#eceefb;--side2:#e1e4f6;--side-ink:#1c1f33;--side-mute:#5c6185;--side-hover:#1c1f3312;--side-line:#1c1f3324;--side-field:#ffffffc0;--side-edge:#c5c9e6;--ink:#1c1f33;--mute:#5c6185;--line:#d9dcf0;
--accent:#0a7fd4;--hl:#7c3aed;--hl2:#0ea5e9;--navy:#2b2670;--g:#2e7d32;--r:#c62828;--y:#8a6100;--head:#231f5a;--head-ink:#fff;--key:#e3e4fb;--zebra:#f5f5fd;
--m:#e3f2e4;--h:#e2ecff;--s:#f8d7d3;--info:#e9f1ff;--warn:#fff6db;--good:#e8f5e9;--bad:#fdecea;
--n-common:#eeedf3;--n-common-l:#8b8aa3;--n-rare:#dff0da;--n-rare-l:#2e7d32;--n-legend:#dcebfa;--n-legend-l:#1f5fbf;--n-unique:#ffe9b0;--n-unique-l:#b37a00;--n-ink:#22242f;--edge:#bcc2e0}
:root[data-theme="dark"]{--bg:#090b14;--panel:#111527;--side:#0b0d1d;--side2:#06070e;--side-ink:#dde1fb;--side-mute:#7c84b3;--side-hover:#ffffff1a;--side-line:#ffffff22;--side-field:#ffffff11;--side-edge:#2e3566;--ink:#e6e8f8;--mute:#979dc2;--line:#262c4d;
--accent:#56c7ff;--hl:#8b5cf6;--hl2:#38bdf8;--navy:#b7c4ff;--g:#6fcf73;--r:#f08080;--y:#e2b84a;--head:#1c1f4a;--head-ink:#f1f2ff;--key:#1b2147;--zebra:#151a33;
--m:#173a2a;--h:#15295a;--s:#4a2030;--info:#131f42;--warn:#3a3116;--good:#16321f;--bad:#3d1c24;
--n-common:#232843;--n-common-l:#5d6591;--n-rare:#173a2a;--n-rare-l:#58b35d;--n-legend:#15295a;--n-legend-l:#5b9bea;--n-unique:#4a3a10;--n-unique-l:#d9a520;--n-ink:#eef0fb;--edge:#343c66}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{--sw:230px;--ow:224px;margin:0;padding-left:var(--sw);background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",Calibri,sans-serif}
a{color:var(--accent)}
[hidden]{display:none!important}
#side{position:fixed;inset:0 auto 0 0;width:var(--sw);background:var(--side);color:var(--side-ink);overflow-y:auto;padding:14px 12px 24px}
#side .brand{font-weight:700;font-size:18px;margin:2px 4px 10px;width:fit-content;background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.qwrap{position:relative;margin-bottom:10px}
#q{width:100%;padding:8px 58px 8px 10px;border-radius:6px;border:1px solid var(--side-edge);background:var(--side-field);color:inherit;font:inherit}
#q::placeholder{color:var(--side-mute)}
#qn{position:absolute;right:9px;top:9px;font-size:12.5px;color:var(--side-mute)}
.partbtn{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;color:inherit;font:600 15px/1.3 inherit;padding:9px 8px;border-radius:6px;cursor:pointer;text-align:left}
.partbtn:hover,.partbtn.on{background:var(--side-hover)}
.navh{margin:14px 8px 4px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--side-mute)}
.navsep{border:0;border-top:1px solid var(--side-line);margin:12px 8px}
.fold>summary{display:flex;align-items:center;gap:7px;list-style:none;cursor:pointer;font-weight:600;font-size:15px;line-height:1.3;padding:9px 8px;border-radius:6px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"▸";color:var(--side-mute);font-size:12px;width:9px}
.fold[open]>summary::before{content:"▾"}
.fold>summary:hover{background:var(--side-hover)}
.fold>.in{margin-left:12px;padding-left:5px;border-left:1px solid var(--side-line)}
.fold .fold>summary,.fold .partbtn{font-size:14px}
.fold .fold .partbtn{font-weight:500}
.partbtn small,.toc small{font-weight:400;font-size:12px;white-space:nowrap;margin-left:8px}
.partbtn small{color:var(--side-mute)}
#wrap{display:grid;grid-template-columns:minmax(calc(var(--ow) + 30px),1fr) minmax(0,1180px) minmax(0,1fr);align-items:start}
.mepill{display:flex;gap:6px}
.mepill.corner{position:fixed;top:20px;right:22px;z-index:40}
.mepill button{display:inline-flex;align-items:center;gap:8px;height:36px;min-width:36px;border-radius:18px;border:1px solid color-mix(in srgb,var(--hl) 35%,var(--line));
background:color-mix(in srgb,var(--hl) 8%,var(--panel));color:var(--ink);cursor:pointer;font:13px inherit;backdrop-filter:blur(6px)}
.mepill button:hover{border-color:var(--hl)}
.mepill .mewho{padding:0 14px 0 4px;max-width:220px}
.mepill .mewho:has(svg){padding-left:12px}
.mepill .mewho span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mepill img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.mepill svg,.memenu svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mepill .merf{padding:0;width:36px;justify-content:center}
.mepill .merf.busy svg{animation:mespin 1s linear infinite}
@keyframes mespin{to{transform:rotate(360deg)}}
.memenu{position:fixed;z-index:50;min-width:230px;display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:14px;border:1px solid color-mix(in srgb,var(--hl) 35%,var(--line));
background:var(--panel);box-shadow:0 14px 34px #0005}
.memenu button{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:10px;border:1px solid transparent;background:none;color:var(--ink);font:13px inherit;text-align:left;cursor:pointer}
.memenu button:hover{background:var(--tint)}.memenu button.on{border-color:var(--hl);background:color-mix(in srgb,var(--hl) 14%,var(--panel))}
.memenu img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.memenu span{display:flex;flex-direction:column}.memenu small{color:var(--mute);font-size:11.5px}
.memenu .meall{color:var(--hl2);border-top:1px solid var(--line);border-radius:0 0 10px 10px;margin-top:2px}
@media (max-width:700px){.mepill .mewho span{max-width:90px}}
.dbic{display:inline-block;width:24px;height:24px;flex:none;vertical-align:middle;margin-right:6px;border-radius:5px;background-repeat:no-repeat;
background-size:480px auto;background-position:calc(var(--x) * -24px) calc(var(--y) * -24px)}
.dbic.big{width:40px;height:40px;background-size:800px auto;background-position:calc(var(--x) * -40px) calc(var(--y) * -40px)}
.cfind{max-width:520px;margin:0 0 10px}
.cextra .pic{display:flex;align-items:center;gap:8px}
.tool .cextra button.cdel{display:inline-grid;place-items:center;width:32px;height:32px;padding:0}
.tool .cextra button.cdel svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool .cextra button.cdel:hover{border-color:#ef4444;color:#f87171}
.cmats a.dblink{color:inherit;text-decoration:none;border-bottom:1px dotted color-mix(in srgb,var(--hl) 60%,transparent)}
.cmats a.dblink:hover{color:var(--hl2)}
.chead .csucc{display:inline-flex;align-items:center;gap:8px;margin-left:18px;font-weight:400}
/* Database */
#db>.fq{width:100%;max-width:none;margin:4px 0 12px}
.dbcats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:0 0 16px}
.tool button.dbcat{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:13px 15px;border-radius:13px;text-align:left;
border:1px solid color-mix(in srgb,var(--hl) 25%,var(--line));background:color-mix(in srgb,var(--hl) 6%,var(--panel));transition:border-color .15s,transform .15s}
.tool button.dbcat:hover{border-color:var(--hl);transform:translateY(-1px)}
.dbct{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.dbct b{font-size:15px;color:var(--navy)}.dbct small{color:var(--hl2);font-weight:600}
.dbcd{color:var(--mute);font-size:12.5px;line-height:1.35}
.dbcrumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 10px;font-size:13.5px}
.dbcrumb a{color:var(--hl2);text-decoration:none}.dbcrumb a:hover{text-decoration:underline}.dbcrumb .sep{color:var(--mute)}
.dblist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.tool button.dbrow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:11px;text-align:left;
border:1px solid color-mix(in srgb,var(--hl) 18%,var(--line));background:color-mix(in srgb,var(--hl) 4%,var(--panel))}
.tool button.dbrow:hover{border-color:var(--hl)}
.dbrow span{display:flex;flex-direction:column;min-width:0}.dbrow b{font-size:13.5px;line-height:1.25}.dbrow small{color:var(--mute);font-size:12px}
.dbrow .dbic,.dbhead .dbic{margin:0}
.tool button.dbmore{margin:12px auto 0;display:block;padding:8px 18px;border-radius:10px}
.dbhead{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;padding:14px 16px;margin:0 0 12px;border-radius:16px;border:1px solid color-mix(in srgb,var(--hl) 38%,var(--line));
background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--hl) 18%,var(--panel)),color-mix(in srgb,var(--hl2) 6%,var(--panel)) 65%)}
.dbic.huge{width:64px;height:64px;border-radius:12px;background-size:1280px auto;background-position:calc(var(--x) * -64px) calc(var(--y) * -64px);
background-color:color-mix(in srgb,var(--hl) 10%,var(--panel))}
.dbwords{flex:1 1 260px;display:flex;flex-direction:column;gap:3px}.dbtitle{font-size:20px;color:var(--navy)}.dbsub{color:var(--ink)}.dbwords small{color:var(--mute)}
.dbacts{display:flex;flex-wrap:wrap;gap:6px}
.tool .dbacts button{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:10px}
.tool .dbacts button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool .dbacts button.dbgo{border-color:var(--hl);background:color-mix(in srgb,var(--hl) 22%,var(--panel));font-weight:600}
.dbdesc{white-space:pre-line}
.dbblock{margin:0 0 6px}
ul.dbul{margin:4px 0 10px;padding-left:18px}ul.dbul li{margin:3px 0}ul.dbul small{color:var(--mute)}ul.dbul .dbic{width:20px;height:20px;background-size:400px auto;background-position:calc(var(--x) * -20px) calc(var(--y) * -20px);margin-right:5px}
a.dbname{color:inherit;text-decoration:none;border-bottom:1px dotted color-mix(in srgb,var(--hl) 60%,transparent)}a.dbname:hover{color:var(--hl2)}
a.dbname.g3,b.g3{color:var(--rar-u)}a.dbname.g2,b.g2{color:var(--rar-e)}a.dbname.g1,b.g1{color:var(--rar-r)}a.dbname.g4,b.g4{color:var(--rar-s)}
.dbtags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.dbtag{padding:3px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--hl) 25%,var(--line));font-size:12.5px}
.dbrecipe{padding:8px 12px;margin:0 0 8px;border-radius:11px;border:1px solid color-mix(in srgb,var(--hl) 20%,var(--line));background:color-mix(in srgb,var(--hl) 4%,var(--panel))}
.dbfilters{margin-bottom:8px}
#db>.dbfq{width:100%;max-width:none;margin:0 0 8px}
.dbtabs{display:flex;flex-wrap:wrap;gap:2px 4px;margin:0 0 6px;border-bottom:1px solid var(--line)}
.tool .dbtabs button{height:34px;padding:0 11px;border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mute);font-size:13.5px;margin-bottom:-1px}
.tool .dbtabs button:hover{color:var(--ink);background:none}
.tool .dbtabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--hl)}
table.dbtable{width:100%;border-collapse:collapse;font-size:14px}
.dbtable th{background:var(--panel)!important;border-radius:0!important;text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.dbtable th.sort{cursor:pointer;user-select:none}.dbtable th.sort:hover{color:var(--ink)}
.dbarrow{margin-left:5px;color:var(--hl2)}
.dbtable td{padding:6px 10px;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);vertical-align:middle}
.dbtable tbody tr{cursor:pointer}.dbtable tbody tr:hover,.dbtable tbody tr:focus-visible{background:color-mix(in srgb,var(--hl) 8%,transparent);outline:none}
.dbtable .dblv{text-align:right;width:1%;white-space:nowrap}
.dbtable .dbg{width:1%;white-space:nowrap}
.dbtable .dbg .g1{color:var(--rar-r)}.dbtable .dbg .g2{color:var(--rar-e)}.dbtable .dbg .g3{color:var(--rar-u)}.dbtable .dbg .g4{color:var(--rar-s)}
.dbtable .dbsrc{width:1%}
td.dbsrc{white-space:nowrap}
.dbit{display:flex;align-items:center;gap:10px}.dbit .dbic{margin:0;flex:none}
.dbit span{display:flex;flex-direction:column;min-width:0}.dbit b{font-size:14px;line-height:1.25}.dbit small{color:var(--mute);font-size:12px}
.dbchip{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border-radius:6px;border:1px solid color-mix(in srgb,var(--hl) 25%,var(--line));
background:color-mix(in srgb,var(--hl) 6%,var(--panel));font-size:12px;white-space:nowrap}
@media (max-width:640px){.dbtable .dbsrc,.dbtable .dbg{display:none}}
.cprofs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tool .cprofs button{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;font-size:13.5px}
.tool .cprofs button small{color:var(--mute);font-size:12px}
.tool .cprofs button.on{border-color:var(--hl);background:color-mix(in srgb,var(--hl) 22%,var(--panel));box-shadow:inset 0 0 0 1px var(--hl)}
.tool .cprofs button.on small{color:var(--hl2)}
#calc input.cq{margin:2px 0 8px}
.crecs details.crgrp{margin:6px 0}
.clhead{display:flex;align-items:center;gap:12px}.tool .clhead button.creset{margin-left:auto;font-weight:400;font-size:12.5px}
.crgrp>summary small{color:var(--hl2);font-weight:600;margin-left:4px}
.crlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:6px}
.tool button.crec{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:11px;text-align:left;
border:1px solid color-mix(in srgb,var(--hl) 16%,var(--line));background:color-mix(in srgb,var(--hl) 3%,var(--panel))}
.tool button.crec:hover{border-color:var(--hl)}
.tool button.crec.on{border-color:var(--hl);background:color-mix(in srgb,var(--hl) 16%,var(--panel))}
.crec span:not(.crmark):not(.dbic){display:flex;flex-direction:column;min-width:0;flex:1}.crec b{font-size:13px;line-height:1.25}.crec small{color:var(--mute);font-size:11.5px}
.crec b.g3{color:var(--rar-u)}.crec b.g2{color:var(--rar-e)}.crec b.g1{color:var(--rar-r)}.crec b.g4{color:var(--rar-s)}
.crmark{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--hl2);border:1px solid color-mix(in srgb,var(--hl) 40%,var(--line))}
.crec.on .crmark{background:var(--hl);color:#fff;border-color:var(--hl)}
.crec .dbic{margin:0}
.clist .pic{display:flex;align-items:center;gap:8px}.clist .pic span{display:flex;flex-direction:column}.clist .pic small{color:var(--mute);font-size:12px}
.clist tr.cnob td{border-bottom:0}
.tool .clist select{max-width:210px}
.clist tr.cstock td{padding-top:0;padding-bottom:10px;background:none}
.cstbox{padding:8px 12px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.cstock .csl{display:block;color:var(--mute);font-size:12.5px;margin:0 0 6px}
.cstgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 16px}
.cstock .cst{display:flex;flex-direction:column;align-items:flex-start;gap:4px;font-size:13px;color:var(--ink)}
.clist b.g3{color:var(--rar-u)}.clist b.g2{color:var(--rar-e)}.clist b.g1{color:var(--rar-r)}.clist b.g4{color:var(--rar-s)}
.tool .clist button.cdel{display:inline-grid;place-items:center;width:32px;height:32px;padding:0}
.tool .clist button.cdel svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool .clist button.cdel:hover{border-color:#ef4444;color:#f87171}
/* my character */
.mesearch{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 10px}
.mesearch .fq{margin:0;flex:1 1 260px}
.tool .mesearch select{height:40px;border-radius:11px;padding:0 12px}
.tool .mesearch button.mego{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:11px;font-weight:600}
.tool .mesearch button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.memsg{margin:6px 0 10px;color:var(--hl2);font-weight:600}
.mehits{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin:0 0 14px}
.tool button.mehit{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;text-align:left}
.mehit img{width:40px;height:40px;flex:none;border-radius:10px;object-fit:cover;background:var(--tint)}
.mehit span,.metile span{display:flex;flex-direction:column;min-width:0}
.mehit small,.metile small{color:var(--mute);font-size:12px}
.meswitch{margin:4px 0 12px}.tool .meswitch button .tic{object-fit:cover}
.mecard .bemb{overflow:hidden;padding:0}.mecard .mepic{width:100%;height:100%;object-fit:cover}
.mename{font-size:21px;color:var(--navy)}.meat{color:var(--mute);font-size:12px}
.megear{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:0 0 14px}
.metile{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;border:1px solid color-mix(in srgb,var(--hl) 22%,var(--line));background:color-mix(in srgb,var(--hl) 5%,var(--panel))}
.metile img{width:40px;height:40px;flex:none;border-radius:8px;background:var(--tint)}
.metile b{font-size:13.5px;line-height:1.25}.metile b.g3{color:var(--rar-u)}.metile b.g2{color:var(--rar-e)}.metile b.g1{color:var(--rar-r)}.metile b.g4{color:var(--rar-s)}
.meskills td:nth-child(2),.meskills td:nth-child(3){white-space:nowrap;color:var(--mute)}
#outline{position:sticky;top:22px;justify-self:end;overscroll-behavior:contain;width:var(--ow);max-height:calc(100vh - 44px);overflow-y:auto;scrollbar-width:thin;margin:22px 0 0 16px;padding:10px 10px 12px;background:var(--panel);border:1px solid color-mix(in srgb,var(--hl) 35%,var(--line));border-radius:10px;box-shadow:0 8px 26px #0004}
#ohead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 4px 8px;padding-bottom:7px;border-bottom:2px solid;border-image:linear-gradient(90deg,var(--hl2),var(--hl)) 1}
#otitle{font-weight:700;font-size:15px;color:var(--navy)}
#ofold{width:24px;height:24px;border-radius:5px;border:1px solid var(--line);background:none;color:var(--mute);cursor:pointer;font:700 14px/1 inherit;padding:0}
#ofold:hover{border-color:var(--hl);color:var(--ink)}
#outline.folded .toc{display:none}
#outline.folded #ohead{margin-bottom:0;padding-bottom:0;border:0}
.toc{list-style:none;margin:0;padding:0;display:none}
.toc.on{display:block}
.toc small{color:var(--mute)}
.toc a{display:flex;justify-content:space-between;color:var(--ink);text-decoration:none;padding:5px 8px;border-radius:5px;font-size:13.5px;border-left:2px solid transparent}
.toc a:hover{background:var(--zebra)}
.toc a.cur{border-left-color:var(--hl2);background:var(--key);font-weight:600}
.toc>li{position:relative}
.toc>li>a{padding-left:24px}
.tgl{position:absolute;left:3px;top:4px;width:20px;height:22px;border:0;border-radius:4px;background:none;color:var(--mute);cursor:pointer;font-size:12px;padding:0}
.tgl:hover{background:var(--key);color:var(--ink)}
.subtoc{list-style:none;margin:0 0 4px;padding:0 0 0 24px}
.subtoc a{font-size:12.5px;padding:3px 8px;color:var(--mute)}
.subtoc a:hover{color:var(--ink)}

.num input::-webkit-outer-spin-button,.num input::-webkit-inner-spin-button,.csum input::-webkit-outer-spin-button,.csum input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num input,.csum input{-moz-appearance:textfield;appearance:textfield}
#outline{background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(8px);border-radius:14px}
body.no-toc #outline{display:none}
body.no-toc #wrap{grid-template-columns:1fr minmax(0,1180px) 1fr}
#wrap>#outline{grid-column:1}
#wrap>main{grid-column:2}
#top button{backdrop-filter:blur(6px)}
.tic{width:24px;height:24px;border-radius:6px;vertical-align:-7px;margin-right:8px;background:#0003}
.tic.big{width:36px;height:36px;border-radius:8px;margin:0;vertical-align:middle;flex:none}
.tic.inl{width:18px;height:18px;border-radius:4px;vertical-align:-4px;margin-right:4px}
.tic.none{display:inline-block;background:var(--key);opacity:.5}
.thumb{width:64px;height:36px;border-radius:7px;object-fit:contain;background:#0003;vertical-align:middle;margin-right:12px;box-shadow:0 0 0 1px var(--line)}
img.thumb[src*="image/webp"]{background:#0003}
.thumb.none{display:inline-grid;place-items:center;box-shadow:none}
.thumb.none svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pic{display:flex;align-items:center;gap:10px}
.brow .tic.big{width:32px;height:32px}
/* the quick glossary pairs the Portuguese terms of the guide with the game's English ones: no use in English */
html[lang=en] #prog-glossario-rapido,html[lang=en] .toc li:has(a[href="#prog-glossario-rapido"]){display:none}
/* routine as cards */
.rtoday{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 2px;padding:12px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--hl) 30%,var(--line));background:var(--tint)}
.rtt{margin-right:6px;color:var(--navy)}
.rpill{padding:4px 11px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.rpill.warn{border-color:#d4a017;color:var(--y);font-weight:600}
.rgrp{margin:12px 0 6px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:8px}
.ritem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;border:1px solid var(--line);background:var(--panel);transition:border-color .15s}
.ritem:hover{border-color:color-mix(in srgb,var(--hl) 45%,var(--line))}
.ritem .thumb{margin:0;flex:none}
.rwords{flex:1;min-width:0}
.rwords b{display:block;font-size:13.5px;font-weight:600;line-height:1.3}
.rwords small{color:var(--mute);font-size:12px}
.rwarn{flex:none;width:20px;text-align:center;font-size:16px;cursor:help}
.ritem.full{border-color:#d4a017}
.ritem.full .rwarn{color:var(--y)}
.ritem.done{opacity:.6}
.ritem.done .rwarn{color:var(--g);font-weight:700}
.ritem.off{opacity:.4}
/* home: events, today, news */
.hchip{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:14px;font-size:12.5px;border:1px solid color-mix(in srgb,var(--hl) 35%,var(--line));background:var(--tint);color:var(--ink)}
#hq{margin-top:14px;width:min(460px,100%);padding:10px 14px;border-radius:11px;border:1px solid color-mix(in srgb,var(--hl) 35%,var(--line));background:var(--panel);color:var(--ink);font:inherit}
.hhead{margin:22px 0 10px;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.hevents{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.hev{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:var(--panel);position:relative}
.hev b{font-size:14.5px;color:var(--navy);padding-right:30px}
.hev .when{font-size:13px;color:var(--mute)}
.hev .when strong{color:var(--ink)}
.hev.live{border-color:var(--g);box-shadow:0 0 0 1px var(--g),0 8px 22px color-mix(in srgb,var(--g) 22%,transparent)}
.hev .livetag{align-self:flex-start;padding:1px 8px;border-radius:9px;background:var(--g);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em}
.hev .bell{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--mute);cursor:pointer;font-size:14px;padding:0}
.hev .bell{display:grid;place-items:center}
.hev .bell svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hev .bell:hover{border-color:var(--hl2);color:var(--ink)}
.hev .bell.on{background:linear-gradient(135deg,var(--hl2),var(--hl));border-color:transparent;color:#fff}
.hcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.hbox{padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.hbox .hhead{margin-top:0}
.hbox ul{list-style:none;margin:0;padding:0}
.hbox li{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.hbox li:last-child{border-bottom:0}
.hbox li.warn{color:var(--y);font-weight:600}
.hbox li.go{cursor:pointer}
.hbox li.go:hover{color:var(--accent)}
.hbox li time{display:inline-block;min-width:52px;color:var(--mute);font-size:12.5px}
/* finder, settings */
.fq{width:min(520px,100%);padding:10px 14px;border-radius:11px;border:1px solid color-mix(in srgb,var(--hl) 35%,var(--line));background:var(--panel);color:var(--ink);font:inherit;margin:8px 0 12px}
.fres{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.fitem{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.fhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.fic{flex:none;width:40px;height:40px;border-radius:9px;background:color-mix(in srgb,var(--hl) 12%,#0004) no-repeat;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--hl) 30%,var(--line))}
.fkind{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:10px;padding:1px 8px}
.fitem ul{margin:0;padding-left:18px;font-size:13.5px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.tool button.sw{display:flex;align-items:center;gap:8px;padding:6px 12px}
.sw i{width:18px;height:18px;border-radius:50%;display:inline-block}
.tool button.sw.on{border-color:var(--hl);box-shadow:0 0 0 2px color-mix(in srgb,var(--hl) 40%,transparent)}
.setrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:8px 0}
.setrow>span:first-child{min-width:190px;font-weight:600}
.setrow label{display:inline-flex;gap:6px;align-items:center}
.rsub{cursor:pointer}
/* home */
#part-home{padding-top:44px}
.hero{display:flex;gap:22px;align-items:center;padding:34px 34px;border-radius:18px;border:1px solid color-mix(in srgb,var(--hl) 35%,var(--line));background:radial-gradient(600px 240px at 12% 0%,color-mix(in srgb,var(--hl) 30%,transparent),transparent 70%),radial-gradient(520px 260px at 92% 100%,color-mix(in srgb,var(--hl2) 22%,transparent),transparent 70%),var(--panel);box-shadow:0 14px 40px #0003}
.hmark{display:grid;place-items:center;flex:none;width:84px;height:84px;border-radius:22px;background:linear-gradient(135deg,var(--hl2),var(--hl));box-shadow:0 10px 34px color-mix(in srgb,var(--hl) 45%,transparent)}
.hmark svg{width:44px;height:44px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hname{font-size:40px;font-weight:800;line-height:1.1;letter-spacing:-.01em;width:fit-content;background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hsub{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.htag{margin:10px 0 0;font-size:16px;color:var(--ink)}
.hcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:18px}
.hcard{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.hcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--hl) 55%,var(--line));box-shadow:0 12px 30px color-mix(in srgb,var(--hl) 22%,transparent)}
.hcard .hico{width:44px;height:44px;border-radius:12px;margin-bottom:4px}
.hcard .hico svg{width:23px;height:23px}
.hcard b{font-size:17px;color:var(--navy)}
.hcard .hdesc{font-size:13.5px;color:var(--mute);min-height:38px}
.hcard .ptrack{width:100%;max-width:none;flex:none;margin-top:4px}
.hcard .hstat{font-size:12.5px;color:var(--accent);font-weight:600}
@media (max-width:760px){#wrap>main,#wrap>#outline{grid-column:auto}.hero{flex-direction:column;align-items:flex-start;padding:22px}.hname{font-size:30px}.part>header h1{padding-right:0;font-size:22px}}
@media print{.hico,.pprog,#part-home{display:none}}
/* ---------- one palette: every surface takes a little of the accent ---------- */
:root{--bg:color-mix(in srgb,var(--hl) 5%,#f4f5fb);--zebra:color-mix(in srgb,var(--hl) 4%,#f8f9fd);--key:color-mix(in srgb,var(--hl) 11%,#f0f1fb);
--line:color-mix(in srgb,var(--hl) 18%,#dcdff0);--head:color-mix(in srgb,var(--hl) 62%,#1c1b45);--navy:color-mix(in srgb,var(--hl) 55%,#14163a);
--accent:color-mix(in srgb,var(--hl2) 78%,#00122e);--side:color-mix(in srgb,var(--hl) 9%,#eef0fb);--side2:color-mix(in srgb,var(--hl) 15%,#e3e6f6);
--side-edge:color-mix(in srgb,var(--hl) 24%,#cdd1ea)}

--key:color-mix(in srgb,var(--hl) 17%,#141830);--line:color-mix(in srgb,var(--hl) 24%,#20253f);--head:color-mix(in srgb,var(--hl) 42%,#12142c);
--navy:color-mix(in srgb,var(--hl2) 30%,#e4e8ff);--mute:color-mix(in srgb,var(--hl) 12%,#9aa1c4);--accent:color-mix(in srgb,var(--hl2) 80%,#fff);
--side:color-mix(in srgb,var(--hl) 10%,#090b17);--side2:color-mix(in srgb,var(--hl) 4%,#05060c);--side-edge:color-mix(in srgb,var(--hl) 30%,#20253f)}
details.sec[open]>summary{background:linear-gradient(90deg,var(--tint),transparent 70%)}
.chead{border-bottom-color:color-mix(in srgb,var(--hl) 30%,var(--line))}
.toc a.cur{background:var(--tint)}
/* routine cards */
.thumb{box-shadow:0 0 0 1px color-mix(in srgb,var(--hl) 40%,var(--line));background:color-mix(in srgb,var(--hl) 20%,#0b0d1d)}
.thumb.none{box-shadow:0 4px 12px color-mix(in srgb,var(--hl) 30%,transparent)}
.tone-a{background:linear-gradient(135deg,var(--hl2),var(--hl))}
.tone-b{background:linear-gradient(135deg,var(--hl),color-mix(in srgb,var(--hl) 48%,#0a0618))}
.tone-c{background:linear-gradient(135deg,color-mix(in srgb,var(--hl2) 72%,#fff),color-mix(in srgb,var(--hl2) 65%,var(--hl)))}
.tone-d{background:linear-gradient(135deg,color-mix(in srgb,var(--hl2) 45%,var(--hl)),color-mix(in srgb,var(--hl) 45%,#05040f))}
.ritem{border-left:3px solid color-mix(in srgb,var(--hl) 42%,var(--line));background:linear-gradient(100deg,color-mix(in srgb,var(--hl) 7%,var(--panel)),var(--panel) 60%)}
.ritem:hover{border-left-color:var(--hl2)}
.ritem.full{border-color:#d4a017;border-left-color:#d4a017}
.ritem.done{border-left-color:var(--g)}
.rgrp{display:flex;align-items:center;gap:8px}
.rgrp::before{content:"";width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--hl2),var(--hl))}
.rtoday{background:linear-gradient(100deg,color-mix(in srgb,var(--hl) 16%,var(--panel)),color-mix(in srgb,var(--hl2) 8%,var(--panel)))}
.rpill{border-color:color-mix(in srgb,var(--hl) 30%,var(--line))}
/* home */
.hev{border-top:2px solid color-mix(in srgb,var(--hl) 55%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--hl) 8%,var(--panel)),var(--panel) 70%)}
.hev.live{border-top-color:var(--g)}
.hbox{border-top:2px solid color-mix(in srgb,var(--hl2) 55%,var(--line))}
.hcard{background:linear-gradient(160deg,color-mix(in srgb,var(--hl) 9%,var(--panel)),var(--panel) 55%)}
.hhead{display:flex;align-items:center;gap:8px}

.fitem,.bchip{border-color:color-mix(in srgb,var(--hl) 26%,var(--line))}
/* routine: square item icons and scope tags */
.ritem .thumb{width:42px;height:42px;border-radius:10px;object-fit:cover}

.rtag{display:inline-block;margin-right:6px;padding:0 6px;border-radius:5px;font-size:9.5px;font-weight:700;letter-spacing:.06em;line-height:16px;vertical-align:1px;
color:color-mix(in srgb,var(--hl2) 75%,var(--ink));border:1px solid color-mix(in srgb,var(--hl2) 55%,var(--line))}
.rtag.srv{color:color-mix(in srgb,var(--hl) 70%,var(--ink));border-color:color-mix(in srgb,var(--hl) 60%,var(--line))}
/* routine: Daily beside Weekly, one row per counter */
.rcols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;margin-top:12px}
.rcol{padding:14px 14px 10px;border-radius:14px;border:1px solid var(--line);background:var(--panel);min-width:0}
.rcolh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin:0 2px 10px}

.prow{display:flex;flex-wrap:wrap;gap:7px}

<script>
const BOARDS = __BOARDS__, EN = __EN__, ICONS = __ICONS__, CALC = __CALC__, ROUTINE = __ROUTINE__, BLD = __BLD__, BIC = __BIC__, PUBLIC = __PUBLIC__, NEWS = __NEWS__, TIC = __TIC__, BUILT = '__BUILT__';
const UI = {
  pt: {search: 'Buscar…  ( / )', openall: 'Abrir tudo', closeall: 'Fechar tudo', exp: 'Exportar marcações', imp: 'Importar marcações',
    foot: 'Gerado em {d}. As marcações ficam salvas neste navegador.', badfile: 'Não consegui ler esse arquivo.',
    markAll: 'Marcar tudo', reset: 'Desmarcar tudo', undo: 'Desfazer', pChar: 'Personagem', pAdd: 'Personagem', pName: 'Nome', pDone: '{a} de {b} marcados', pDrag: 'Arraste para mudar a ordem', pDel: 'Excluir', pDelAsk: 'Excluir o personagem “{n}”? As marcações da Progressão e da Rotina dele somem e não dá para desfazer.', pPic: 'Escolher imagem', pClasses: 'Classes', pWings: 'Asas', pNoPic: 'Sem imagem', main: 'Main', alt: 'Alt {n}',

    crystals: 'Cristais', upTo: 'Vai até o nº {n} de {t}', upNone: 'Nenhum nó ainda', siteGoal: 'Meta do site', dmgGoal: 'Rota de dano', topGoal: 'Topo do Global', markUpTo: 'Marcar como pegos até aqui', clearTaken: 'Limpar pegos',
    clearAsk: 'Limpar os nós marcados como pegos em {b}?', takenHere: 'Pegos neste tabuleiro', node: ['nó', 'nós'], crystal: ['cristal', 'cristais'],
    start: 'Início', no: 'Nº', topKR: 'dos top KR', cumul: 'acumulado', tipHint: 'Clique para marcar como pego', tipUn: 'Pego. Clique para desmarcar',
    have: 'Tenho', plan: 'Plano (soma das barras)', left: 'sobram', short: 'faltam', spentAll: 'Já marcados como pegos'},
  en: {search: 'Search…  ( / )', openall: 'Open all', closeall: 'Close all', exp: 'Export marks', imp: 'Import marks',
    foot: 'Built on {d}. Your marks are saved in this browser.', badfile: 'Could not read that file.',
    markAll: 'Tick all', reset: 'Untick all', undo: 'Undo', pChar: 'Character', pAdd: 'Character', pName: 'Name', pDone: '{a} of {b} ticked', pDrag: 'Drag to change the order', pDel: 'Delete', pDelAsk: 'Delete the character “{n}”? Its Progressão marks and Routine counters go too, and this cannot be undone.', pPic: 'Choose a picture', pClasses: 'Classes', pWings: 'Wings', pNoPic: 'No picture', main: 'Main', alt: 'Alt {n}',
    pHow: 'Each character has its own marks. The characters are the same as in the Routine.',
    next: 'Next unmarked item', hide: 'Hide marked items', alldone: 'Everything in this part is marked.',
    theme: 'Light/dark theme', home: 'Home', fold: 'Fold or open the topics', badLink: 'Could not open what came in that link.', mine: 'Your value', credit: 'Fan site, not affiliated with NCSOFT. Game data and pictures: wikily.gg and metabot.gg.', subs: 'Open or fold the subtopics', lang: 'Language: Portuguese / English',
    crystals: 'Crystals', upTo: 'Goes up to No. {n} of {t}', upNone: 'No nodes yet', siteGoal: 'Site target', dmgGoal: 'Damage route', topGoal: 'Global top', markUpTo: 'Mark as taken up to here', clearTaken: 'Clear taken',
    clearAsk: 'Clear the nodes marked as taken on {b}?', takenHere: 'Taken on this board', node: ['node', 'nodes'], crystal: ['crystal', 'crystals'],
    start: 'Start', no: 'No.', topKR: 'of top KR players', cumul: 'running total', tipHint: 'Click to mark as taken', tipUn: 'Taken. Click to unmark',
    have: 'I have', plan: 'Plan (sum of the sliders)', left: 'left over', short: 'short', spentAll: 'Already marked as taken'},
};
const KEY = 'aion2guia:v1';
let S = {checks: {}, open: {}, part: null, theme: null, lang: 'pt', taken: {}, budget: {}, scroll: {}, resets: {}, tab: {}, hideDone: false, crystals: 0, fold: false, folders: {}, subShut: {}, mine: {}, accent: 'violet'};
try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const u = k => (UI[S.lang] || UI.pt)[k] || UI.pt[k];
const pl = (n, k) => n + ' ' + u(k)[n === 1 ? 0 : 1];
const make = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
let searching = false;
const repaint = [];  // things with language-dependent text built in script
const homeStat = {};  // one line about each page, for its card on the home page
const shared = {};    // what to do with a build or a roster that arrives in a link
const shown = {};     // pages that redraw themselves when they are opened

// ---------- skill icons ----------
// ICONS: {class: {skill or passive: picture}}; a build page says its class in data-icons
const IC = {}, icCss = [];
Object.keys(ICONS).forEach(cls => {
  const names = Object.keys(ICONS[cls]), ids = {};
  names.forEach(n => { ids[n] = 'ic-' + icCss.length; icCss.push('.' + ids[n] + '{background-image:url(' + ICONS[cls][n] + ')}'); });
  const order = [...names].sort((a, b) => b.length - a.length);
  IC[cls] = {ids, re: names.length ? new RegExp('(?<![\\w])(' + order.map(n => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')(?![\\w])', 'g') : null};
});
document.head.appendChild(make('style', '', icCss.join('\n')));
const icon = (name, cls) => make('i', 'ic ' + ((IC[cls] || {ids: {}}).ids[name] || ''));
function iconize(root) {
  const cls = root.dataset.icons, icRe = IC[cls] && IC[cls].re;
  if (!icRe) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n =>
    n.parentNode.closest('svg, button, a, .bctl, .binfo, .csum, .resetrow, .tabs, .pbar') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  const nodes = []; let n;
  while ((n = walker.nextNode())) nodes.push(n);
  const gameText = node => {
    const td = node.parentNode.closest('td'), head = td && td.closest('table').rows[0].cells[td.cellIndex];
    return !!head && /texto do jogo|game text|^n[ií]vel \d|^level \d/i.test(head.textContent.trim());
  };
  nodes.filter(node => !gameText(node)).forEach(node => {
    [...node.data.matchAll(icRe)].reverse().forEach(m => {
      const prev = node.previousSibling;
      if (m.index === 0 && prev && prev.nodeType === 1 && prev.classList.contains('ic')) return;
      const at = m.index ? node.splitText(m.index) : node;
      at.parentNode.insertBefore(icon(m[1], cls), at);
    });
  });
}

// ---------- pictures of materials, gear and dungeons ----------
if (TIC.Kina) TIC.Kinah = TIC.Kina;  // the progression page spells it the old way
const tic = (key, cls) => { if (!TIC[key]) return null; const i = make('img', cls || 'tic'); i.src = TIC[key]; i.alt = ''; i.loading = 'lazy'; return i; };
// in the text pages: a small picture before the name of every material and currency
const TERMS = Object.keys(TIC).filter(k => !k.includes(':') && !/Wings|Chalice|Parchment|Compass|Bell|Mirror/.test(k)).sort((a, b) => b.length - a.length);
const termRe = TERMS.length ? new RegExp('(?<![\\w])(' + TERMS.map(n => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')(?![\\w])', 'g') : null;
function termize(root) {
  if (!termRe) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n =>
    n.parentNode.closest('svg, button, a, select, .tool, .resetrow, summary, h3') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  const nodes = []; let n;
  while ((n = walker.nextNode())) nodes.push(n);
  nodes.forEach(node => [...node.data.matchAll(termRe)].reverse().forEach(m => {
    const at = m.index ? node.splitText(m.index) : node;
    at.parentNode.insertBefore(tic(m[1], 'tic inl'), at);
  }));
}

// ---------- settings: a column for the reader's own values (public site) ----------
if (PUBLIC) $$('.part[data-part=cfg] table.data').forEach(tb => {
  const head = tb.rows[0], at = [...head.cells].findIndex(c => c.textContent.trim() === 'Sugestão');
  if (at < 0) return;
  const sec = tb.closest('details').id, th = make('th', 'head'); th.dataset.ui = 'mine'; head.cells[at].after(th);
  [...tb.rows].slice(1).forEach(tr => {
    if (tr.cells.length <= at) return;
    const key = sec + '|' + tr.cells[0].textContent.trim(), inp = make('input', 'mine'), td = make('td');
    inp.type = 'text'; inp.value = S.mine[key] || '';
    inp.oninput = () => { if (inp.value) S.mine[key] = inp.value; else delete S.mine[key]; save(); };
    td.appendChild(inp); tr.cells[at].after(td);
  });
});

// ---------- theme and language ----------
function applyTheme() {
  const t = S.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t;
  $('#theme').textContent = t === 'dark' ? '☀' : '☾';
}
$('#theme').onclick = () => { S.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); };
function applyLang() {
  const en = S.lang === 'en';
  document.documentElement.lang = en ? 'en' : 'pt-BR';
  clearMarks();
  $$('[data-t]').forEach(el => {
    if (el._pt == null) el._pt = el.innerHTML;
    const tr = EN[el.dataset.t];
    el.innerHTML = en && tr != null ? tr : el._pt;
  });
  $$('.part[data-icons]').forEach(iconize);
  $$('.part[data-part=prog], .part[data-part=craft]').forEach(termize);
  $$('[data-ui]').forEach(el => el.textContent = u(el.dataset.ui));
  $$('[data-ui-ph]').forEach(el => el.placeholder = u(el.dataset.uiPh));
  $$('[data-ui-title]').forEach(el => el.title = u(el.dataset.uiTitle));
  $('#lang').innerHTML = en ? 'PT · <b>EN</b>' : '<b>PT</b> · EN';
  $('#foot').textContent = u('foot').replace('{d}', BUILT) + (PUBLIC ? ' ' + u('credit') : '');
  repaint.forEach(f => f());
  if (searching) runSearch();
}
$('#lang').onclick = () => { S.lang = S.lang === 'en' ? 'pt' : 'en'; save(); applyLang(); };

// ---------- parts, sections, menu ----------
function fitTables(root) {
  $$('.tw', root || document).forEach(t => { t.classList.remove('fit'); if (t.clientWidth && t.scrollWidth <= t.clientWidth + 1) t.classList.add('fit'); });
}
const paintTitle = () => { const b = $('.partbtn.on span'); if (b) $('#otitle').textContent = b.textContent; };
$$('details.fold').forEach(d => {
  if (d.dataset.fold in S.folders) d.open = S.folders[d.dataset.fold];
  d.addEventListener('toggle', () => { S.folders[d.dataset.fold] = d.open; save(); });
});
function paintFold() { $('#outline').classList.toggle('folded', !!S.fold); $('#ofold').textContent = S.fold ? '+' : '−'; }
$('#ofold').onclick = () => { S.fold = !S.fold; save(); paintFold(); };
paintFold();
function showPart(id, keep) {
  S.part = id; save();
  $$('.part').forEach(p => p.classList.toggle('on', p.dataset.part === id));
  $$('.partbtn').forEach(b => b.classList.toggle('on', b.dataset.part === id));
  for (let f = $('.partbtn.on') && $('.partbtn.on').closest('.fold'); f; f = f.parentNode.closest('.fold')) f.open = true;
  $$('.toc').forEach(t => t.classList.toggle('on', t.dataset.part === id));
  document.body.classList.toggle('no-toc', !$('.toc.on'));  // the home page has no topics
  paintTitle();
  if (id === 'home') paintHome();
  if (shown[id]) shown[id]();
  fitTables();
  if (!keep) scrollTo({top: S.scroll[id] || 0, behavior: 'instant'});
  markCurrent();
}
function push(hash) { try { history.pushState(null, '', '#' + hash); } catch (e) {} }
let picked = null, pickedAt = 0;  // topic chosen in the menu: it stays lit until the reader scrolls away by hand
function openSection(d, target) {
  showPart(d.closest('.part').dataset.part, true);
  d.open = true;
  picked = (target && target.id) || d.id; pickedAt = Date.now();
  const pane = target && target.closest('.tabpane');
  if (pane) pane._show();
  (target || d).scrollIntoView({behavior: 'smooth', block: 'start'});
  markCurrent();  // right away: when the place is already on screen nothing scrolls
}
function route() {
  const link = /^#(build)=(.+)$/.exec(location.hash);
  if (link) { unpack(link[2]).then(obj => shared[link[1]] && shared[link[1]](obj)).catch(() => alert(u('badLink'))); return false; }
  const id = decodeURIComponent(location.hash.slice(1)), el = id && document.getElementById(id);
  if (!el) return false;
  if (el.matches('.part')) showPart(el.dataset.part);
  else if (el.matches('details.sec')) openSection(el);
  else if (el.closest('details.sec')) openSection(el.closest('details.sec'), el);
  return true;
}

const SITE = 'https://lmzinn.github.io/Atreia-Hub/';
async function pack(obj) {
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  let bytes = raw, tag = 'j';
  if (window.CompressionStream) { bytes = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()); tag = 'z'; }
  let bin = ''; bytes.forEach(b => { bin += String.fromCharCode(b); });
  return tag + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function unpack(text) {
  const bytes = Uint8Array.from(atob(text.slice(1).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
  const raw = text[0] === 'z' ? new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()) : bytes;
  return JSON.parse(new TextDecoder().decode(raw));
}
async function copyLink(kind, obj, done) {
  // a link made from a local file would only work on this computer: point it at the published site
  const url = (location.protocol === 'https:' ? location.origin + location.pathname : SITE) + '#' + kind + '=' + await pack(obj);
  try { await navigator.clipboard.writeText(url); alert(done + '\n\n' + url.slice(0, 80) + '…'); } catch (e) { prompt(done, url); }
}

  function home() {

  // how an item is obtained, from the source lines of wikily: craft, dungeon, monster drop, quest, chest, shop...
  const GORD = {Common: 1, Rare: 2, Epic: 3, Legend: 3, Legendary: 3, Heroic: 3, Unique: 4, Special: 5, Mythic: 6};
  const SRCS = ['craft', 'dungeon', 'drop', 'quest', 'chest', 'shop', 'achieve', 'gather', 'other'];
  const CRAFTS = /^(Armorsmithing|Blacksmithing|Handicrafting|Alchemy|Cooking|Substance Morph|Crafting Combo)$/;
  const srcKinds = e => {

  };
  const level = e => +(e.l || String(e.lv || e.rl || '').split(' ')[0] || 0);
  const TABORD = ['Longsword', 'Greatsword', 'Dagger', 'Bow', 'Spellbook', 'Orb', 'Staff', 'Mace', 'Guard', 'Shield', 'Gauntlet',
    'Helm', 'Pauldrons', 'Top', 'Gloves', 'Legs', 'Shoes', 'Cloak', 'Necklace', 'Earrings', 'Ring', 'Bracelet', 'Amulet', 'Belt', 'Rune'];
  const tabRank = k => { const i = TABORD.indexOf(k); return i < 0 ? 99 : i; };
  function category(cat) {

    // a filter by name, inside this category
    const q = make('input', 'fq dbfq'); q.type = 'search'; q.autocomplete = 'off'; q.value = f.q || '';

    q.oninput = () => { f.q = q.value; limit = 60; save(); fill(); };
    dbHost.appendChild(q);
    // the kinds as tabs: All, Longsword, Greatsword, Bow...
    const kinds = [...new Set(all.map(tabOf).filter(Boolean))].sort((x, y) => tabRank(x) - tabRank(y) || x.localeCompare(y));
    if (kinds.length > 1 && kinds.length <= 12) {
      const tabs = make('div', 'dbtabs');
      [''].concat(kinds).forEach(k => {
        const b = make('button', (f[tabKey] || '') === k ? 'on' : '', k || du('anyT')); b.type = 'button';
        b.onclick = () => { f[tabKey] = k; limit = 60; save(); draw(); }; tabs.appendChild(b);
      });
      dbHost.appendChild(tabs);
    }
    // grade, source, class, faction and the order
    const bar = make('div', 'cctl dbfilters');
    const pick = (key, label, opts) => {
      if (opts.length < 2 && !f[key]) return;
      bar.appendChild(labeled(label, pickBox(f[key] || '', [['', du('any')]].concat(opts), v => { f[key] = v; limit = 60; }, draw)));
    };
    const vals = get => [...new Set(all.map(get).filter(Boolean))];
    if (kinds.length > 12) pick(tabKey, du('f')[tabKey], kinds.map(v => [v, v]));  // too many kinds for tabs
    pick('grade', du('f').grade, vals(e => e.g).sort((x, y) => (GORD[x] || 0) - (GORD[y] || 0)).map(v => [v, v]));
    if (hasSrc) pick('src', du('f').src, SRCS.filter(k => all.some(e => srcKinds(e).includes(k))).map(k => [k, du('srcs')[k]]));
    pick('cls', du('f').cls, vals(e => e.k).sort().map(v => [v, v]));
    const sorts = [].concat(hasLv ? ['lv-d', 'lv-a'] : [], hasG ? ['g-d', 'g-a'] : [], ['n-a', 'n-d']);
    if (!sorts.includes(f.sort)) f.sort = sorts[0];
    if (bar.children.length) dbHost.appendChild(bar);
    const body = make('div');
    dbHost.appendChild(body);
    function fill() {
      body.textContent = '';
      const term = fold((f.q || '').trim());
      const list = all.filter(e => (!term || fold(e.n).includes(term)) && (!f[tabKey] || tabOf(e) === f[tabKey]) && (!f.grade || e.g === f.grade)
        && (!f.src || srcKinds(e).includes(f.src)) && (!f.cls || e.k === f.cls));
      const [by, dir] = f.sort.split('-'), sign = dir === 'd' ? -1 : 1;

  function results(q) {

    const facts = rows => { const dl = make('div', 'bsum'); rows.filter(r => r[1]).forEach(([k, v]) => { const d = make('div', 'bchip'); d.append(make('b', '', String(v)), make('small', '', k)); dl.appendChild(d); }); return dl; };

  function draw() {
    dbHost.textContent = '';

  const when = t => new Date(t).toLocaleString(S.lang === 'en' ? 'en-GB' : 'pt-BR', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'});
  const get = async (route, params) => {
    const r = await fetch(AAPI + '/' + route + '?' + new URLSearchParams(params));
    if (!r.ok) throw new Error(route + ' ' + r.status);
    return r.json();
  };
  let servers = null, hits = null, msg = '', busy = false;
  // one refresh per character every 5 minutes, so the official site is not asked over and over; the time is in the saved sheet (c.at)
  const COOL = 5 * 60000, left = c => Math.max(0, COOL - (Date.now() - (c.at || 0))), mins = ms => Math.ceil(ms / 60000);
  const paintCool = b => {
    const c = S.me.list.find(x => key(x) === b.dataset.cool), l = c ? left(c) : 0;
    b.disabled = busy || !AAPI || l > 0;
    if (b.dataset.label) b.lastChild.textContent = b.dataset.label + (l ? ' (' + mins(l) + ' min)' : '');
    b.title = (b.dataset.tip || mu('upd')) + (l ? ' · ' + mu('wait').replace('{m}', mins(l)) : '');
  };
  const cool = (b, c, label, tip) => { b.dataset.cool = key(c); if (label) b.dataset.label = label; if (tip) b.dataset.tip = tip; paintCool(b); return b; };
  setInterval(() => document.querySelectorAll('[data-cool]').forEach(paintCool), 10000);
  const say = (text, then) => { msg = text; busy = false; draw(); if (then) setTimeout(() => { if (msg === text) { msg = ''; draw(); } }, then); };

  async function fetchChar(cid, sid) {
    const q = {lang: 'en-US', characterId: cid, serverId: sid, region: 'la'};
    const [info, eq] = await Promise.all([get('info', q), get('equipment', q)]);
    const boards = (info.daevanion && info.daevanion.boardList) || [], dv = {};
    await Promise.all(boards.filter(x => x.openNodeCount).map(async x => {
      dv[x.id] = ((await get('daevanion', {...q, boardId: x.id})).nodeList || []).filter(n => n.open).map(n => [n.col, n.row]); }));
    const t = info.title || {}, pw = eq.petwing || {};
    return {cid, sid, at: Date.now(), p: info.profile, dv,
      stats: ((info.stat && info.stat.statList) || []).map(s => [s.name, s.value]),
      titles: {owned: t.ownedCount || 0, total: t.totalCount || 0, on: (t.titleList || []).map(x => [x.equipCategory, x.name, x.grade])},
      boards: boards.map(x => [x.id, x.name, x.openNodeCount, x.totalNodeCount]),
      gear: ((eq.equipment && eq.equipment.equipmentList) || []).map(x => [x.slotPosName, x.name, x.grade, x.enchantLevel || 0, x.icon]),
      skills: ((eq.skill && eq.skill.skillList) || []).filter(s => s.acquired).map(s => [s.name, s.category, s.skillLevel, s.equip, s.icon]),
      wing: pw.wing ? [pw.wing.name, pw.wing.enchantLevel || 0, pw.wing.icon] : null, pet: pw.pet ? [pw.pet.name, pw.pet.level, pw.pet.icon] : null};
  }
  async function open(cid, sid) {
    const had = S.me.list.find(x => key(x) === cid + '@' + sid);
    if (had && left(had)) { hits = null; msg = ''; S.me.q = ''; setActive(key(had)); return; }  // refreshed a moment ago: show the saved sheet
    msg = mu('loading'); busy = true; draw(); drawPill();
    try {
      const c = await fetchChar(cid, sid), at = S.me.list.findIndex(x => key(x) === key(c));
      if (at >= 0) S.me.list[at] = c; else S.me.list.push(c);
      hits = null; msg = ''; busy = false; S.me.q = ''; setActive(key(c));
    } catch (e) { say(mu('fail')); drawPill(); }
  }
  // what the sheet fills in by itself: the build made from it, the crafting class and pieces, the crystals, the enhancement piece
  function applyChar(c) {
    const cls = clsOf(c), race = c.p.raceId === 2 ? 'Asmodians' : 'Elyos';
    if (S.builds && S.builds.list.some(b => b.src === key(c))) toBuild(c, true);
    if (CALC.pieces && CALC.pieces.some(P => P.cls === cls)) {
      S.craft = S.craft || {}; S.craft.cls = cls; S.craft.race = race; S.craft.list = S.craft.list || {};
      const worn = new Set(c.gear.map(g => g[1])), RANKS = ['none', 'true', 'trueS', 'white', 'whiteS', 'wise', 'wiseS'];
      CALC.pieces.filter(P => P.race === race).forEach(P => {
        const st = P.steps.filter(x => RANKS.includes(x.tier) && worn.has(x.name)).pop(); if (!st) return;
        const k = race[0] + ':' + P.piece, e = S.craft.list[k] = S.craft.list[k] || {qty: 0, target: 'true', own: 'none'};
        if (RANKS.indexOf(st.tier) > RANKS.indexOf(e.own)) e.own = st.tier;
      });
    }
    if (BLD.boards && BLD.boards[cls]) {
      const sum = Object.entries(c.dv).reduce((t, [id, cells]) => { const i = BOARD_AT[id], B = BLD.boards[cls][i]; if (!B || i > 3) return t;
        const off = (15 - B.size) / 2, at = {}; B.nodes.forEach(n => { at[n[0] + ',' + n[1]] = n[2]; });
        return t + cells.reduce((x, [col, row]) => x + (at[(col - 1 - off) + ',' + (row - 1 - off)] || 0), 0); }, 0);
      if (cls === 'Assassin') S.crystals = sum; else (S.crystalsBy = S.crystalsBy || {})[cls] = sum;
    }
    ME.enhSync(c);
  }
  // the active character: the Routine, the Progressão and the build editor follow it when they have it
  function setActive(k) {
    const c = S.me.list.find(x => key(x) === k); if (!c) return;
    S.me.cur = k; S.me.q = ''; hits = null; applyChar(c);
    const names = (S.rt && S.rt.names) || [], i = names.findIndex(n => (n || '').toLowerCase() === c.p.characterName.toLowerCase());
    if (i >= 0 && i < progChars()) { S.rt.cur = i; S.progChar = i; }
    const b = S.builds && S.builds.list.find(x => x.src === k); if (b) S.builds.cur = b.id;
    save(); charsChanged();
  }
  ME.now = () => curChar() || null;
  async function search(name, sid) {
    msg = mu('finding'); busy = true; draw();
    try {
      const r = await get('search', {keyword: name, ...(sid ? {serverId: sid} : {}), page: 1, size: 20, region: 'la', localeInfo: 'en-US'});
      hits = (r.list || []).map(h => ({cid: decodeURIComponent(h.characterId), sid: h.serverId, name: h.name.replace(/<[^>]+>/g, ''), lv: h.level, server: h.serverName,
        pic: h.profileImageUrl ? 'https://profileimg.plaync.com' + h.profileImageUrl : ''}));
      say(hits.length ? '' : mu('none'));
    } catch (e) { say(mu('fail')); }
  }

  // ----- into the build editor: gear, Arcana, skill levels, Stigmas, titles, wings, pet and the Daevanion nodes
  function toBuild(c, quiet) {
    const cls = clsOf(c);
    if (!BLD.skills || !BLD.skills[cls]) { if (!quiet) say(mu('noCls').replace('{c}', c.p.className)); return; }
    const b = {id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), src: key(c), name: c.p.characterName, cls, race: c.p.raceId === 2 ? 2 : 1,
      lvl: {}, eq: {}, sp: {}, stig: [], dv: {}, gear: {}, titles: {}, arcana: {}, wings: '', pet: '', notes: mu('note').replace('{d}', when(c.at))};
    const miss = [], items = {};
    ['weapons', 'armor', 'accessories'].forEach(k => BLD[k].forEach(x => { items[x[0]] = x; }));
    c.gear.forEach(([slot, name, grade, enh]) => {
      const withGrade = name + ' (' + grade + ')';
      if (SLOT[slot]) { const n = items[name] ? name : items[withGrade] ? withGrade : ''; if (n) b.gear[SLOT[slot]] = {n, e: Math.min(enh, items[n][4])}; else miss.push(name); }
      else if (/^Arcana/.test(slot)) { if (BLD.arcana.some(a => a[0] === withGrade)) b.arcana[name.split(' ')[0]] = withGrade; else miss.push(name); }
    });
    // the official boards are 15 x 15 squares; the smaller ones sit in the middle of that grid
    Object.entries(c.dv).forEach(([id, cells]) => {
      const i = BOARD_AT[id], B = i != null && BLD.boards[cls][i]; if (!B) return;
      const off = (15 - B.size) / 2, at = {}, taken = {};
      B.nodes.forEach((n, j) => { at[n[0] + ',' + n[1]] = j; });
      cells.forEach(([col, row]) => { const j = at[(col - 1 - off) + ',' + (row - 1 - off)]; if (j != null && B.nodes[j][2]) taken[j] = 1; });
      b.dv[i] = taken;
    });
    // the sheet shows the final skill level: what the Daevanion adds comes off, and what is left above the trainable top is gear
    const names = new Set(BLD.skills[cls].map(s => s.n)), fromDv = {}, sheet = {};
    BLD.boards[cls].forEach((B, i) => Object.keys(b.dv[i] || {}).forEach(j => B.nodes[j][3].split('. ').forEach(part => {
      const m = /^(.*?) \+(\d+)$/.exec(part); if (m && names.has(m[1])) fromDv[m[1]] = (fromDv[m[1]] || 0) + +m[2]; })));
    c.skills.forEach(([n, cat, lv, on]) => { sheet[n] = [lv, on]; });
    BLD.skills[cls].forEach(s => {
      const got = sheet[s.n]; if (!got) return;
      const total = got[0] - (fromDv[s.n] || 0), lv = Math.max(s.c === 'S' ? 0 : 1, Math.min(s.cost.length, total));
      b.lvl[s.n] = lv; if (total > lv && lv) b.eq[s.n] = total - lv;
      if (s.c === 'S' && got[1] && b.stig.length < 4) b.stig.push(s.n);
    });
    c.titles.on.forEach(([cat, name]) => { if (TITLE[cat] && BLD.titles.some(t => t[0] === name)) b.titles[TITLE[cat]] = name; });
    if (c.wing && BLD.wings.some(w => w[0] === c.wing[0])) b.wings = c.wing[0];
    if (c.pet && BLD.pets.includes(c.pet[0])) b.pet = c.pet[0];
    S.builds = Object.assign({list: [], cur: null, tab: 'skills', board: 0}, S.builds || {});
    const old = S.builds.list.findIndex(x => x.src === b.src);
    if (old >= 0) { b.id = S.builds.list[old].id; S.builds.list[old] = b; } else S.builds.list.push(b);
    if (quiet) return;
    S.builds.cur = b.id; save();
    say(mu(old >= 0 ? 'rebuilt' : 'built').replace('{n}', b.name) + (miss.length ? ' ' + mu('missing').replace('{l}', miss.join(', ')) : ''));
    repaint.forEach(f => f());
    if (!miss.length) location.hash = '#bld-editor';
  }
  // ----- into the Routine and the Progressão: the one with the same name, or the first one still unnamed, or a new one
  function toRoutine(c) {
    S.rt = S.rt || {}; S.rt.names = S.rt.names || []; S.rt.pics = S.rt.pics || {};
    const n = progChars(), name = c.p.characterName.slice(0, 16), cls = clsOf(c);
    let i = [...Array(n).keys()].find(j => (S.rt.names[j] || '').toLowerCase() === name.toLowerCase());
    if (i == null && !S.rt.names[0]) i = 0;
    if (i == null) { if (n >= 6) { say(mu('rtFull')); return; } i = n; S.rt.chars = n + 1; }
    S.rt.names[i] = name;
    if (BLD.weapon && TIC['type:' + BLD.weapon[cls]]) S.rt.pics[i] = 'type:' + BLD.weapon[cls];
    save(); charsChanged(); say(mu('rtDone').replace('{n}', name), 6000);
  }

  const pic = (src, cls) => { const im = make('img', cls || ''); im.src = src; im.alt = ''; im.loading = 'lazy'; return im; };
  function draw() {
    meHost.textContent = '';
    // ----- search
    const bar = make('div', 'mesearch'), q = make('input', 'fq'), sel = make('select'), go = make('button', 'mego');
    q.type = 'search'; q.placeholder = mu('name'); q.value = S.me.q || ''; q.autocomplete = 'off';
    // one group per faction, in the game's order; the servers alphabetical inside it
    const opt = (v, t, host) => { const o = make('option', '', t); o.value = v; host.appendChild(o); };
    opt('', mu('all'), sel);
    [1, 2].forEach(race => {
      const list = (servers || []).filter(x => x.raceId === race).sort((x, y) => x.serverName.localeCompare(y.serverName));
      if (!list.length) return;
      const g = make('optgroup'); g.label = mu('races')[race]; list.forEach(x => opt(String(x.serverId), x.serverName, g)); sel.appendChild(g);
    });
    sel.value = S.me.server || ''; sel.onchange = () => { S.me.server = sel.value; save(); };
    go.type = 'button'; go.append(pico('find', ''), mu('find')); go.disabled = busy || !AAPI;
    const run = () => { const v = q.value.trim(); S.me.q = v; save(); if (v.length >= 2 && AAPI) search(v, sel.value); };
    go.onclick = run; q.onkeydown = e => { if (e.key === 'Enter') run(); };
    bar.append(q, sel, go); meHost.appendChild(bar);
    if (!AAPI) meHost.appendChild(make('p', 'note', mu(location.protocol === 'file:' ? 'offLocal' : 'offRemote')));
    if (msg) meHost.appendChild(make('p', 'memsg' + (busy ? ' busy' : ''), msg));
    if (hits && hits.length) {
      const list = make('div', 'mehits');
      hits.forEach(h => {
        const b = make('button', 'mehit'), words = make('span'); b.type = 'button';
        if (h.pic) b.appendChild(pic(h.pic));
        words.append(make('b', '', h.name), make('small', '', mu('lv').replace('{n}', h.lv) + ' · ' + h.server));
        b.appendChild(words); b.onclick = () => open(h.cid, h.sid); list.appendChild(b);
      });
      meHost.appendChild(list);
    }
    const c = curChar();
    if (!c) return;
    // ----- the saved characters, then the open one
    // same switcher as the Routine's: picture and name on each pill, and one to add another character
    const sw = make('div', 'bswitch meswitch');
    S.me.list.forEach(x => {
      const b = make('button', key(x) === key(c) ? 'on' : ''); b.type = 'button'; b.title = clsOf(x) + ' · ' + where(x);
      b.append(x.p.profileImage ? pic(x.p.profileImage, 'tic') : pico('me', ''), make('span', '', x.p.characterName));
      b.onclick = () => setActive(key(x)); sw.appendChild(b);
    });
    const add = make('button', 'newb'); add.type = 'button'; add.append(pico('plus', ''), mu('pillMore'));
    add.onclick = () => { const f = $('#me .fq'); f.focus(); f.select(); }; sw.appendChild(add);
    meHost.appendChild(sw);
    const card = make('div', 'bcard mecard'), emb = make('span', 'bemb'), main = make('div', 'bmain'), acts = make('div', 'bacts'), p = c.p;
    if (p.profileImage) emb.appendChild(pic(p.profileImage, 'mepic'));
    main.append(make('b', 'mename', p.characterName),
      make('span', 'memeta', [clsOf(c), mu('lv').replace('{n}', p.characterLevel), where(c)].join(' · ')),
      make('small', 'meat', mu('at').replace('{d}', when(c.at))));
    const btn = (icon, text, fn, cls) => { const b = make('button', cls || ''); b.type = 'button'; b.append(pico(icon, ''), text); b.onclick = fn; b.disabled = busy; acts.appendChild(b); return b; };
    cool(btn('daily', mu('upd'), () => open(c.cid, c.sid)), c, mu('upd'));
    btn('bld', mu('toBuild'), () => toBuild(c));
    btn('rot', mu('toRt'), () => toRoutine(c));
    btn('trash', mu('del'), () => { if (confirm(mu('delAsk').replace('{n}', p.characterName))) { S.me.list = S.me.list.filter(x => x !== c); S.me.cur = ''; save(); charsChanged(); } }, 'danger');
    card.append(emb, main, acts); meHost.appendChild(card);
    // ----- numbers at a glance
    const chips = (title, rows) => {
      if (title) meHost.appendChild(make('p', 'chead', title));
      const box = make('div', 'bsum');
      rows.forEach(([v, label]) => { const d = make('div', 'bchip'); d.append(make('b', '', v), make('small', '', label)); box.appendChild(d); });
      meHost.appendChild(box);
    };
    chips('', [[fmtN(p.combatPower || 0), mu('cp')], [c.titles.owned + ' / ' + c.titles.total, mu('titles')]]);
    chips(mu('dv'), c.boards.map(([, name, open, total]) => [open + ' / ' + total, name]));
    // ----- gear and Arcana as tiles
    const tiles = (title, rows) => {
      meHost.appendChild(make('p', 'chead', title));
      const grid = make('div', 'megear');
      rows.forEach(([slot, name, grade, enh, icon]) => {
        const t = make('div', 'metile'), words = make('span');
        if (icon) t.appendChild(pic(icon));
        words.append(make('b', GRADE[grade] || '', name), make('small', '', (enh ? '+' + enh + ' · ' : '') + grade));
        t.appendChild(words); t.title = slot; grid.appendChild(t);
      });
      meHost.appendChild(grid);
    };
    tiles(mu('gear'), c.gear.filter(g => !/^Arcana/.test(g[0])));
    tiles(mu('arcana'), c.gear.filter(g => /^Arcana/.test(g[0])));
    // ----- the rest, closed
    const more = (title, fill) => { const d = make('details', 'more'), inner = make('div', 'in'); d.append(make('summary', '', title), inner); fill(inner); meHost.appendChild(d); };
    more(mu('skills'), host => {
      const tb = toolTable(host, [mu('skills'), '', ''], 'meskills');
      c.skills.filter(s => s[1] !== 'Passive' && (s[2] || s[3])).concat(c.skills.filter(s => s[1] === 'Passive')).forEach(([n, cat, lv, on, icon]) => {
        const tr = tb.insertRow(), a = tr.insertCell();
        a.className = 'key'; if (icon) a.appendChild(pic(icon, 'bic')); a.append(n);
        tr.insertCell().textContent = mu('lv').replace('{n}', lv);
        tr.insertCell().textContent = (mu('cats')[cat] || cat) + (on ? ' · ' + mu('on') : '');
      });
    });
    more(mu('stats'), host => {
      const box = make('div', 'bsum');
      c.stats.forEach(([n, v]) => { const d = make('div', 'bchip'); d.append(make('b', '', fmtN(+v || 0)), make('small', '', n)); box.appendChild(d); });
      host.appendChild(box);
    });
    more(mu('extra'), host => {
      const ul = make('ul');
      c.titles.on.forEach(([cat, name, grade]) => ul.appendChild(make('li', '', name + ' (' + cat + ', ' + grade + ')')));
      if (c.wing) ul.appendChild(make('li', '', mu('wing') + ': ' + c.wing[0] + (c.wing[1] ? ' +' + c.wing[1] : '')));
      if (c.pet) ul.appendChild(make('li', '', mu('pet') + ': ' + c.pet[0] + ' · ' + mu('lv').replace('{n}', c.pet[1])));
      host.appendChild(ul);
    });
  }
  // ----- the pill in the window's top right corner: refresh, then the active character with a menu to change it or add one.
  // When the page is too narrow to leave that corner free, it sits with the language and theme buttons instead.
  const pill = make('div', 'mepill'), menu = make('div', 'memenu');
  menu.hidden = true; document.body.append(pill, menu);
  const placePill = () => {
    const free = innerWidth - $('#top').getBoundingClientRect().right >= 260;  // #top ends where the page cards end
    if (free && pill.parentNode !== document.body) document.body.appendChild(pill);
    if (!free && pill.parentNode !== $('#top')) $('#top').prepend(pill);
    pill.classList.toggle('corner', free);
  };
  addEventListener('resize', () => { placePill(); menu.hidden = true; });
  addEventListener('load', () => setTimeout(placePill, 200));
  const closeMenu = e => { if (!menu.hidden && !menu.contains(e.target) && !pill.contains(e.target)) menu.hidden = true; };
  document.addEventListener('click', closeMenu);
  function drawPill() {
    pill.textContent = ''; menu.textContent = '';
    const c = curChar(), who = make('button', 'mewho');
    who.type = 'button'; who.title = mu('pillTip');
    if (c) { who.appendChild(c.p.profileImage ? pic(c.p.profileImage) : pico('me', '')); who.appendChild(make('span', '', c.p.characterName)); }
    else who.append(pico('plus', ''), make('span', '', mu('pillNone')));
    who.onclick = () => {
      if (!c) { location.hash = '#me-ficha'; return; }
      menu.hidden = !menu.hidden;
      const r = who.getBoundingClientRect(); menu.style.top = (r.bottom + 6) + 'px'; menu.style.right = Math.max(8, innerWidth - r.right) + 'px';
    };
    if (c && AAPI) {
      const rf = make('button', 'merf' + (busy ? ' busy' : '')); rf.type = 'button'; rf.title = mu('upd') + ' · ' + mu('at').replace('{d}', when(c.at));
      rf.appendChild(pico('daily', '')); rf.onclick = () => open(c.cid, c.sid); cool(rf, c, '', rf.title); pill.appendChild(rf);
    }
    pill.appendChild(who); setTimeout(placePill);
    S.me.list.forEach(x => {
      const b = make('button', key(x) === (c && key(c)) ? 'on' : ''), words = make('span'); b.type = 'button';
      if (x.p.profileImage) b.appendChild(pic(x.p.profileImage));
      words.append(make('b', '', x.p.characterName), make('small', '', clsOf(x) + ' · ' + where(x))); b.appendChild(words);
      b.onclick = () => { menu.hidden = true; setActive(key(x)); }; menu.appendChild(b);
    });
    const more = make('button', 'meall'); more.type = 'button'; more.append(pico('plus', ''), mu('pillMore'));
    more.onclick = () => { menu.hidden = true; location.hash = '#me-ficha'; }; menu.appendChild(more);
  }
  repaint.push(drawPill);

  const showMe = () => { draw(); if (AAPI && !servers) get('servers', {lang: 'en-US', region: 'la'}).then(r => { servers = r.serverList || []; draw(); }).catch(() => { servers = []; }); };
  repaint.push(draw);
  shown.me = showMe;
  homeStat.me = () => { const c = curChar(); return c ? c.p.characterName + ' · ' + fmtN(c.p.combatPower || 0) + ' CP' : ''; };
}
