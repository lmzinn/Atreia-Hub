      locked: 'O navegador só libera o som depois de um clique na página: depois de abrir o site, clique em qualquer lugar uma vez.',
      perm: {granted: 'Notificação do navegador: permitida. Se ela não aparecer, ligue as notificações do navegador no Windows e desligue o Não perturbe.', denied: 'Notificação do navegador: bloqueada (cadeado ao lado do endereço). O aviso na tela continua funcionando.',
        default: 'Notificação do navegador: ainda não permitida. Clique em Testar aviso.', none: 'Este navegador não tem notificação; o aviso na tela funciona.'},
      which: 'Eventos', test: 'Testar aviso', testBody: 'Os lembretes estão funcionando.', data: 'Dados salvos', dataHow: 'Marcações, rotina e builds ficam só neste navegador.',
      wipe: 'Apagar tudo', wipeAsk: 'Apagar tudo que este site salvou neste navegador (marcações, rotina, builds)? Não dá para desfazer.',
      colors: {violet: 'Violeta e azul', blue: 'Azul', cyan: 'Ciano', emerald: 'Verde', lime: 'Lima', amber: 'Âmbar', red: 'Vermelho', rose: 'Rosa e laranja', purple: 'Roxo'}},
    en: {look: 'Look', theme: 'Theme', auto: 'Automatic (the system one)', dark: 'Dark', light: 'Light', accent: 'Accent colour', lang: 'Language',
      timer: 'Timers in the corner', timerOpts: {on: 'Show', off: 'Hide'}, notif: 'Event reminders', notifHow: 'With the site open in a tab: a card on the page, a sound and a browser notification.', lead: 'How long before', mins: '{n} minutes', sound: 'Sound', soundOn: 'Play a sound', vol: 'Volume', listen: 'Listen', sounds: {chime: 'Chime', coin: 'Coin', fanfare: 'Fanfare', capture: 'Capture', off: 'No sound'},
      locked: 'The browser only lets the page make sound after a click on it: after opening the site, click anywhere once.',
      perm: {granted: 'Browser notification: allowed. If it does not show, turn the browser notifications on in Windows and Do not disturb off.', denied: 'Browser notification: blocked (padlock beside the address). The card on the page still works.',
        default: 'Browser notification: not allowed yet. Click Test reminder.', none: 'This browser has no notifications; the card on the page works.'},
      which: 'Events', test: 'Test reminder', testBody: 'The reminders are working.', data: 'Saved data', dataHow: 'Marks, routine and builds are kept in this browser only.',
      wipe: 'Delete everything', wipeAsk: 'Delete everything this site saved in this browser (marks, routine, builds)? This cannot be undone.',
      colors: {violet: 'Violet and blue', blue: 'Blue', cyan: 'Cyan', emerald: 'Green', lime: 'Lime', amber: 'Amber', red: 'Red', rose: 'Pink and orange', purple: 'Purple'}}};
  const xu = k => (XUI[S.lang] || XUI.pt)[k];
  const drawSettings = () => {
    setHost.textContent = '';
    const row = (label, ...things) => { const r = make('div', 'setrow'); r.append(make('span', '', label), ...things); setHost.appendChild(r); return r; };
    setHost.appendChild(make('p', 'chead', xu('look')));
    row(xu('theme'), pickBox(S.theme || 'auto', [['auto', xu('auto')], ['dark', xu('dark')], ['light', xu('light')]], v => { S.theme = v === 'auto' ? null : v; }, applyTheme));
    const sw = make('div', 'swatches');
    Object.keys(ACCENTS).forEach(k => {
      const b = make('button', 'sw' + ((S.accent || 'violet') === k ? ' on' : '')), dot = make('i'), pair = ACCENTS[k] || ['#8b5cf6', '#38bdf8'];
      dot.style.background = 'linear-gradient(135deg,' + pair[1] + ',' + pair[0] + ')';
      b.append(dot, xu('colors')[k]); b.onclick = () => { S.accent = k; save(); applyAccent(); drawSettings(); }; sw.appendChild(b);
    });
    row(xu('accent'), sw);
    row(xu('lang'), pickBox(S.lang, [['pt', 'Português'], ['en', 'English']], v => { S.lang = v; }, applyLang));
    setHost.appendChild(make('p', 'chead', xu('notif')));
    setHost.appendChild(make('p', 'note', xu('notifHow')));
    row(xu('timer'), pickBox(S.timer.show ? 'on' : 'off', Object.entries(xu('timerOpts')), v => { S.timer.show = v === 'on'; }, paintTimers));
    row(xu('lead'), pickBox(String(S.notify.lead), [2, 5, 10, 15].map(n => [String(n), xu('mins').replace('{n}', n)]), v => { S.notify.lead = +v; }, () => {}));
    const evs = make('div', 'swatches');
    EVENTS.forEach(e => { const lab = make('label'), box = make('input'); box.type = 'checkbox'; box.checked = !!S.notify.ev[e.id]; box.onclick = ev => { ev.preventDefault(); toggleRemind(e.id, drawSettings); }; lab.append(box, evName(e)); evs.appendChild(lab); });
    row(xu('which'), evs);
    const snd = make('div', 'sndrow'), test = make('button', 'sbtn'), perm = make('p', 'note');
    const state = () => { perm.textContent = xu('perm')[canNotify ? Notification.permission : 'none']; };
    test.type = 'button'; test.append(pico('bell', ''), xu('test'));
    test.onclick = () => {
      const fire = () => { state(); announce($('.brand').textContent, xu('testBody')); };
      if (canNotify && Notification.permission === 'default') try { Notification.requestPermission().then(fire, fire); } catch (e) { fire(); } else fire();
    };
    snd.append(pickBox(S.notify.snd, Object.entries(xu('sounds')), v => { S.notify.snd = v; }, () => { playSound(S.notify.snd); paintSoundCall(); }),
      labeled(xu('vol'), numBox(() => S.notify.vol, v => { S.notify.vol = v; }, 0, 100, 10, false, () => playSound(S.notify.snd))), test);
    row(xu('sound'), snd);
    if (!audioOn()) setHost.appendChild(make('p', 'note', xu('locked')));
    state(); setHost.appendChild(perm);
    setHost.appendChild(make('p', 'chead', xu('data')));
    setHost.appendChild(make('p', 'note', xu('dataHow')));
    const wipe = make('button', 'sbtn danger'), foot = make('div', 'setfoot');
    wipe.type = 'button'; wipe.append(pico('trash', ''), xu('wipe'));
    wipe.onclick = () => { if (confirm(xu('wipeAsk'))) { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); } };
    foot.appendChild(wipe); setHost.appendChild(foot);
  };
  repaint.push(drawSettings);
  shown.set = drawSettings;
}

// ---------- sub-headings in the menu ----------
const PIN = /^$a/;  // sub-headings that get a menu entry of their own
function buildSub() {
  $$('.subtoc, .tgl, .toc > li.pinbar').forEach(x => x.remove());
  $$('details.sec').forEach(d => {
    const hs = $$('h3', d), link = $('.toc a[href="#' + d.id + '"]');
    if (!hs.length || !link) return;
    const ul = make('ul', 'subtoc');
    let last = link.parentNode;
    hs.forEach((h, i) => {
      h.id = d.id + '--' + (i + 1);
      const pinned = PIN.test(h.textContent.trim()), li = make('li', pinned ? 'pinbar' : ''), a = make('a');
      h.dataset.pin = pinned ? '1' : '';
      if (pinned) a.append(make('span', '', h.textContent.split(' (')[0]), make('small'));
      else a.textContent = h.textContent;
      a.href = '#' + h.id;
      a.onclick = e => { e.preventDefault(); endSearch(); push(h.id); openSection(d, h); };
      li.appendChild(a);
      if (pinned) { last.after(li); last = li; } else ul.appendChild(li);
    });
    link.after(ul);
    // the arrow folds the subtopics; the title beside it still goes to the section
    const tg = make('button', 'tgl'), paintT = () => { ul.hidden = !!S.subShut[d.id]; tg.textContent = ul.hidden ? '▸' : '▾'; };
    tg.title = u('subs');
    tg.onclick = () => { S.subShut[d.id] = !S.subShut[d.id]; save(); paintT(); markCurrent(); };
    link.before(tg); paintT();
  });
  markCurrent();
}
repaint.push(buildSub, paintTitle);

// ---------- search ----------
const q = $('#q'), qn = $('#qn');
let hits = [], hitIdx = -1, qTimer = 0;
function fold(s) { const f = s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); return f.length === s.length ? f : s.toLowerCase(); }
function clearMarks() {
  $$('mark.hit').forEach(m => { const p = m.parentNode; p.replaceChild(document.createTextNode(m.textContent), m); p.normalize(); });
  hits = []; hitIdx = -1;
}
function markIn(root, term) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n =>
    n.parentNode.closest('svg, button, .bctl, .binfo, .csum, .resetrow, .tabs, .cctl, .num, .rinfo, .chead, .bsum, .bbar, .bfx, textarea') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  const nodes = []; let n, found = 0;
  while ((n = walker.nextNode())) nodes.push(n);
  nodes.forEach(node => {
    const text = fold(node.data), at = [];
    for (let i = text.indexOf(term); i >= 0; i = text.indexOf(term, i + term.length)) at.push(i);
    at.reverse().forEach(i => {
      const mid = node.splitText(i); mid.splitText(term.length);
      const m = make('mark', 'hit'); mid.parentNode.replaceChild(m, mid); m.appendChild(mid);
    });
    found += at.length;
  });
  return found;
}
function goHit(dir) {
  if (!hits.length) return;
  if (hitIdx >= 0) hits[hitIdx].classList.remove('cur');
  hitIdx = (hitIdx + dir + hits.length) % hits.length;
  const h = hits[hitIdx]; h.classList.add('cur');
  const d = h.closest('details.sec'); if (d) d.open = true;
  const block = h.closest('details.more'); if (block) block.open = true;
  const pane = h.closest('.tabpane'); if (pane) pane._show();
  h.scrollIntoView({behavior: 'instant', block: 'center'});
  qn.textContent = (hitIdx + 1) + '/' + hits.length;
}
function runSearch() {
  const term = fold(q.value.trim());
  clearMarks();
  if (term.length < 2) { endSearch(true); return; }
  searching = true;
  $$('.part').forEach(p => p.classList.add('on'));
  $$('details.sec').forEach(d => {
    const found = markIn(d, term);
    d.hidden = !found; if (found) d.open = true;
  });
  fitTables();
  hits = $$('mark.hit'); hitIdx = -1;
  qn.textContent = hits.length ? '' : '0';
  goHit(1);
}
function endSearch(keepText) {
  if (!searching && !q.value) return;
  if (!keepText) q.value = '';
  clearMarks(); qn.textContent = '';
  if (!searching) return;
  $$('details.sec').forEach(d => { d.hidden = false; d.open = d.id in S.open ? S.open[d.id] : d.dataset.def === '1'; });
  searching = false;
  showPart(S.part, true);
}
q.oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(runSearch, 180); };
q.onkeydown = e => {
  if (e.key === 'Enter') { e.preventDefault(); clearTimeout(qTimer); if (!searching || !hits.length) runSearch(); else goHit(e.shiftKey ? -1 : 1); }
  if (e.key === 'Escape') { endSearch(); q.blur(); }
};
addEventListener('keydown', e => {
  if (e.key === '/' && !e.ctrlKey && !e.metaKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); q.select(); }
});

// ---------- scrolling: current section in the menu, remembered position, back to top ----------
function markCurrent() {
  const secs = $$('.part.on details.sec'), top = x => x.getBoundingClientRect().top, seen = x => x.offsetParent && top(x) < innerHeight - 60;
  const page = document.documentElement, atEnd = scrollY > 0 && innerHeight + scrollY >= page.scrollHeight - 4;
  const pick = picked && document.getElementById(picked);
  let cur, h = null;
  // while the page is still gliding to it (about a second), the picked topic counts even if not in sight yet
  if (pick && pick.closest('.part.on') && (Date.now() - pickedAt < 1500 || (seen(pick) && pick.getBoundingClientRect().bottom > 0))) {
    cur = pick.closest('details.sec');
    h = pick.matches('h3') ? pick : $$('h3', cur).filter(x => x.offsetParent && top(x) < 120).pop();
  } else {
    picked = null;
    // at the very end of the page the last sections never reach the top: the last one in sight is the current one
    const line = atEnd ? x => seen(x) : x => top(x) < 120;
    cur = secs.filter(line).pop() || secs[0];
    h = cur && cur.open ? $$('h3', cur).filter(x => x.offsetParent && line(x)).pop() : null;
  }
  const id = h && h.dataset.pin ? h.id : cur && cur.id;  // inside Titles or Wings, their own entry lights up
  $$('.toc > li > a').forEach(a => a.classList.toggle('cur', !!id && a.getAttribute('href') === '#' + id));
  $$('.subtoc a').forEach(a => a.classList.toggle('cur', !!h && a.getAttribute('href') === '#' + h.id));
  // keep the current topic in sight inside the topics bar
  const at = $$('.toc.on .subtoc a.cur').find(a => a.offsetParent) || $('.toc.on > li > a.cur'), box = $('#outline');
  if (!at || box.scrollHeight <= box.clientHeight) return;
  const r = at.getBoundingClientRect(), b = box.getBoundingClientRect();
  if (r.top < b.top + 50 || r.bottom > b.bottom - 30) box.scrollTop += r.top - b.top - box.clientHeight / 2;
}
let tick = 0, sTimer = 0;
['wheel', 'touchmove'].forEach(ev => addEventListener(ev, () => { picked = null; }, {passive: true}));
addEventListener('keydown', e => { if (['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End', ' '].includes(e.key)) picked = null; });
addEventListener('scroll', () => {
  tip.hidden = true;
  if (tick) return;
  tick = requestAnimationFrame(() => {
    tick = 0;
    if (searching) return;
    markCurrent();
    S.scroll[S.part] = Math.round(scrollY);
    clearTimeout(sTimer); sTimer = setTimeout(save, 400);
  });
}, {passive: true});
addEventListener('resize', () => fitTables());

applyTheme();
applyAccent();
applyLang();
refreshCounts();
const first = S.part && $('.part[data-part="' + S.part + '"]') ? S.part : $$('.part')[0].dataset.part;
if (!route()) showPart(first);
</script>
